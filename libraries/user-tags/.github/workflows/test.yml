name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor, the last release before the autoload column changed, and
        # latest. Running only against the newest hides everything that depends
        # on an API added since.
        wordpress: ['5.9', '6.5', 'latest']
        php: ['7.4', '8.3']

    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
          MARIADB_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer

      - run: composer install --no-interaction

      - name: Install WordPress ${{ matrix.wordpress }}
        run: tests/bin/install.sh wordpress_test root '' 127.0.0.1:3306 ${{ matrix.wordpress }}

      - run: composer test
      - run: composer test:multisite

  lint:
    name: standards and PHP compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-interaction
      - run: composer lint

  plugin-check:
    name: wordpress.org plugin check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `git archive` applies the export-ignore rules in .gitattributes, so this
      # is the tree a consumer bundling a tag receives and the tree the
      # directory would review — not the repository, which carries the test
      # suite and the composer files.
      - name: Build
        run: |
          mkdir -p build/user-tags-lib
          git archive HEAD | tar -x -C build/user-tags-lib

      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/user-tags-lib
